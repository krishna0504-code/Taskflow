services:
  taskflow-api:
    build: .
    container_name: taskflow-api
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret}
      DATABASE_URL: sqlite:////app/instance/taskflow.db
    volumes:
      - taskflow_data:/app/instance
    restart: unless-stopped

volumes:
  taskflow_data:
